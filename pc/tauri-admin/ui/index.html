<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light">
<title>桌链 DeskLink 管理</title>
<style>
  body { margin: 0; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
         gap: 18px; overflow: hidden;
         background:
           radial-gradient(700px 480px at 8% -12%, rgba(255,200,168,.5), transparent 62%),
           radial-gradient(560px 420px at 108% 20%, rgba(163,181,255,.45), transparent 60%),
           radial-gradient(640px 520px at 20% 112%, rgba(154,233,196,.45), transparent 60%),
           linear-gradient(155deg, #ece7e0 0%, #e8e8ed 42%, #dfe3ea 100%);
         color: #3c414c; font-family: "Segoe UI Variable Text", "Segoe UI", "Microsoft YaHei UI", system-ui, sans-serif; }
  .orb { width: 72px; height: 72px; border-radius: 50%;
         background: radial-gradient(circle at 36% 30%, #93a2d6 0%, #5a66a2 30%, #232a52 68%, #0d1129 100%);
         box-shadow: inset 0 -9px 16px rgba(4,6,18,.6), inset 0 5px 9px rgba(255,255,255,.32), 0 12px 26px rgba(15,19,44,.35);
         animation: breathe 2.6s ease-in-out infinite; }
  @keyframes breathe { 0%,100% { transform: scale(.96); filter: brightness(.94); } 50% { transform: scale(1.04); filter: brightness(1.08); } }
  .title { font-size: 15px; font-weight: 600; color: #15161a; }
  .sub { font-size: 12px; color: #5d6470; text-align: center; line-height: 1.7; }
  @media (prefers-reduced-motion: reduce) { .orb { animation: none; } }
</style>
</head>
<body>
  <div class="orb" aria-hidden="true"></div>
  <div class="title">桌链 DeskLink</div>
  <div class="sub">正在连接本机管理服务（127.0.0.1:8765）…<br>
  如果长时间停留在此页，请确认桌链托盘服务正在运行。</div>
</body>
</html>
